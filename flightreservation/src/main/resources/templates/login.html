<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #f1f1f1;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: white;
        }

        /* CENTER */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CARD */
        .card {
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* INPUT */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        input:focus {
            border-color: #4ca1af;
            outline: none;
        }

        /* BUTTON */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #4ca1af, #2c3e50);
            color: white;
            border: none;
            border-radius: 25px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: scale(1.03);
        }

        /* ERROR MESSAGE */
        .error {
            color: red;
            margin-top: 10px;
        }

        /* REGISTER LINK */
        .register-link {
            margin-top: 15px;
        }

        .register-link a {
            color: #4ca1af;
            font-weight: 500;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div><b>✈️ FlyHigh</b></div>

    <div>
        <a th:href="@{/showLogin}">Login</a>
        <a th:href="@{/showRegister}">Register</a>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="card">

        <h2>Login</h2>

        <form th:action="@{/login}" method="post">

            <input type="email" name="email" placeholder="Enter Email" required/>
            <input type="password" name="password" placeholder="Enter Password" required/>

            <button class="btn-login">Login</button>

        </form>

        <!-- ERROR -->
        <p class="error" th:text="${msg}"></p>

        <!-- REGISTER OPTION -->
        <div class="register-link">
            <p>
                Don't have an account?
                <a th:href="@{/showRegister}">Register here</a>
            </p>
        </div>

    </div>

</div>

</body>
</html>
