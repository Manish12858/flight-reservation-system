<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /*  SMOOTH NAVBAR */
        .navbar {
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #f1f1f1;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #ffffff;
            opacity: 0.9;
        }

        /* CENTER */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ✨ IMPROVED CARD */
        .card {
            width: 520px;
            padding: 50px;
            text-align: center;
            border-radius: 18px;

            /* better contrast */
            background: rgba(255, 255, 255, 0.95);

            box-shadow:
                0 10px 25px rgba(0,0,0,0.2);

            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* TEXT FIX */
        h1 {
            margin-bottom: 15px;
            font-size: 28px;
            color: #222;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #555;
        }

        /* BUTTONS */
        .actions {
            margin-top: 20px;
        }

        .btn {
            margin: 10px;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div><b>✈️ FlyHigh</b></div>

    <div>
        <a th:href="@{/showLogin}">Login</a>
        <a th:href="@{/showRegister}">Register</a>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="card">

        <h1>✈️ Flight Reservation System</h1>

        <p>
            Book flights, manage your reservations, and complete check-in with ease.
            Experience a smooth and reliable journey from start to finish.
        </p>

        <div class="actions">
            <a th:href="@{/showLogin}">
                <button class="btn btn-primary">Login</button>
            </a>

            <a th:href="@{/showRegister}">
                <button class="btn btn-success">Register</button>
            </a>
        </div>

    </div>

</div>

</body>
</html>
