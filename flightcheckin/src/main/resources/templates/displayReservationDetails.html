<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reservation Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #f1f1f1;
            text-decoration: none;
            margin-left: 20px;
        }

        /* MAIN CENTER */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CARD */
        .card {
            width: 600px;
            padding: 35px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 20px;
        }

        /* SECTION BOX */
        .section {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .section p {
            margin: 6px 0;
        }

        /* INPUT */
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 5px;
        }

        input:focus {
            border-color: #4ca1af;
            outline: none;
        }

        /* BUTTON */
        .btn-checkin {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(to right, #11998e, #38ef7d);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-checkin:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>

<!-- ✅ MANUAL NAVBAR -->
<div class="navbar">
    <div><b>✈️ FlyHigh</b></div>

    <div>
        <!-- Reservation module -->
        <a href="http://localhost:8080/">Home</a>
        <a href="http://localhost:8080/findFlights">Book Flight</a>

        <!-- Check-in module -->
        <a href="http://localhost:8081/flightcheckin/showStartCheckIn">Check-In</a>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="card">

        <h2>Reservation Details ✈️</h2>

        <!-- 👤 PASSENGER -->
        <div class="section">
            <h3>Passenger Information</h3>

            <p>
                <b>Name:</b>
                <span th:text="${reservation.passenger.firstName}"></span>
                <span th:text="${reservation.passenger.lastName}"></span>
            </p>

            <p>
                <b>Email:</b>
                <span th:text="${reservation.passenger.email}"></span>
            </p>

            <p>
                <b>Phone:</b>
                <span th:text="${reservation.passenger.phone}"></span>
            </p>
        </div>

        <!-- ✈️ FLIGHT -->
        <div class="section">
            <h3>Flight Information</h3>

            <p><b>Flight Number:</b>
                <span th:text="${reservation.flight.flightNumber}"></span>
            </p>

            <p><b>From:</b>
                <span th:text="${reservation.flight.departureCity}"></span>
            </p>

            <p><b>To:</b>
                <span th:text="${reservation.flight.arrivalCity}"></span>
            </p>

            <p><b>Date:</b>
                <span th:text="${#dates.format(reservation.flight.dateOfDeparture, 'dd MMM yyyy')}"></span>
            </p>

            <p><b>Departure Time:</b>
                <span th:text="${#dates.format(reservation.flight.estimatedDepartureTime, 'HH:mm')}"></span>
            </p>
        </div>

        <!-- 🧳 CHECK-IN -->
        <h3>Complete Check-In</h3>

        <form th:action="@{/completeCheckIn}" method="post">

            <input type="hidden" name="reservationId" th:value="${reservation.id}" />

            <label><b>Number of Bags</b></label>
            <input type="number" name="numberOfBags" placeholder="Enter number of bags" required />

            <button class="btn-checkin">Complete Check-In</button>

        </form>

    </div>

</div>

</body>
</html>
